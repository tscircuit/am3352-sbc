name: Check partial routing
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_board_signoff:
        description: Build and audit the complete routed board
        required: false
        default: false
        type: boolean
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun scripts/check-ddr-vendor.ts
      - run: bun run check:autorouter-vendor
      - run: bun run check:fanout-vendor
      - run: bun run test:routing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pcb-snapshot-diffs
          path: tests/__snapshots__/*.diff.png
          if-no-files-found: ignore
      - run: bun run build:placement
  full-board-signoff:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_board_signoff }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build --no-images
      - run: bun run audit:routed-board output/board.circuit.json
