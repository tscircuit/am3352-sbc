name: Full native SBC proof
on:
  push:
    branches: [validation/full-native-am3352-20261026]
  workflow_dispatch:
jobs:
  native_board:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 360
    env:
      BUN_JSC_forceRAMSize: "8589934592"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install exact source dependencies
        run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Restore verified native DDR prefix cache
        run: |
          python3 - <<'PY'
          import hashlib,json,tarfile,pathlib
          folder=pathlib.Path('routing/native-cache'); manifest=json.loads((folder/'manifest.json').read_text())['entries']
          destination=pathlib.Path('.tscircuit/cache'); destination.mkdir(parents=True,exist_ok=True)
          with tarfile.open(folder/'validated-ddr-prefix.tar.gz') as archive:
            assert set(archive.getnames())==set(manifest)
            for name,expected in manifest.items():
              assert pathlib.Path(name).name==name
              data=archive.extractfile(name).read();assert hashlib.sha256(data).hexdigest()==expected
              (destination/name).write_bytes(data)
          print('Restored two byte-exact native cache entries; no generated copper modified')
          PY
      - name: Route entire native board and export official site
        run: |
          mkdir -p validation
          set -o pipefail
          node --max-old-space-size=49152 --import ./scripts/node-runtime-register.mjs --import ./node_modules/tsx/dist/esm/index.mjs ./node_modules/@tscircuit/cli/dist/cli/main.js build index.circuit.tsx --disable-parts-engine --autorouter-timeout 14400s --autorouter-dump-srj all --autorouter-debug-dir validation/autorouter --site --use-cdn-javascript 2>&1 | tee validation/build.log
      - name: Run all 23 native routing checks
        run: |
          set -o pipefail
          bun check-routing.ts dist/index/circuit.json 2>&1 | tee validation/routing-checks.log
      - name: Check manufactured vias
        run: |
          set -o pipefail
          bun check-vias.ts dist/index/circuit.json 2>&1 | tee validation/via-checks.log
      - name: Actually load every native model
        run: |
          set -o pipefail
          bun check-models.ts dist/index/circuit.json 2>&1 | tee validation/model-checks.log
      - name: Record actual output hash and completion
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('dist/index/circuit.json'); raw=p.read_bytes(); rows=json.loads(raw)
          report={'scope':'Complete native source build and checks; no runtime intervention or CircuitJSON rewriting','nativeSha256':hashlib.sha256(raw).hexdigest(),'rows':len(rows),'traces':sum(r['type']=='pcb_trace' for r in rows),'vias':sum(r['type']=='pcb_via' for r in rows),'allChecksPassed':True}
          pathlib.Path('validation/full-native-proof.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-native-sbc-proof
          path: |
            dist/
            validation/
            .tscircuit/model-check-report.json
          if-no-files-found: warn
